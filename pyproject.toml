[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "openapi-codegen"
version = "0.1.0"
description = "Generate Pydantic models, requests clients and extensible Flask blueprints from an OpenAPI 3.x document (JSON or YAML)."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# The generator itself needs nothing beyond the standard library. The code it writes needs pydantic
# (models), requests (clients) and flask (blueprints); see the README.
dependencies = []

[project.optional-dependencies]
# Reading a .yaml/.yml spec. JSON needs nothing.
yaml = ["pyyaml"]

[dependency-groups]
# What development needs: PyYAML, the libraries the generated code imports, and the test and lint tools.
dev = ["pytest", "pyyaml", "pydantic", "requests", "flask", "ruff==0.16.10"]

[project.scripts]
openapi-codegen = "openapi_codegen.__main__:main"

[tool.uv.build-backend]
module-name = "openapi_codegen"

[tool.pytest.ini_options]
testpaths = ["tests"]
