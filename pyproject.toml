[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-codegen"
version = "0.1.0"
description = "Generate Pydantic models, requests clients and extensible Flask blueprints from an OpenAPI 3.x document (JSON or YAML)."
readme = "README.md"
requires-python = ">=3.12"
# The generator itself needs nothing beyond the standard library. The code it writes needs pydantic
# (models), requests (clients) and flask (blueprints); see the README.
dependencies = []

[project.optional-dependencies]
# Reading a .yaml/.yml spec. JSON needs nothing.
yaml = ["pyyaml"]
# What the tests need: PyYAML, and the libraries the generated code imports.
test = ["pytest", "pyyaml", "pydantic", "requests", "flask", "ruff==0.16.10"]

[project.scripts]
openapi-codegen = "openapi_codegen.__main__:main"

[tool.setuptools]
packages = ["openapi_codegen"]

[tool.setuptools.package-data]
# runtime/ holds the base classes that are copied into every generated package. They are data, not a package.
openapi_codegen = ["runtime/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
