name: Release

# Builds the package when a GitHub release is published and attaches the wheel, the sdist and their checksums to
# it, so other projects can depend on those files (a lockfile records the wheel's hash) instead of on a git tag.
#
# To release: raise `version` in pyproject.toml and merge it, then publish a release whose tag is v<version>.
# If the tag and the version disagree this fails before building anything.
#
# To attach files to a release that already exists, run it by hand (Actions > Release > Run workflow) with its tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of an existing release to build and attach to, e.g. v0.1.0
        required: true
        type: string

# The building runs with a read-only token; only the upload step below can write to the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Through the environment, never pasted into a script.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG but pyproject.toml says version $version. Raise the version, merge, then publish the release as v<version>."
            exit 1
          fi

      - name: Build the wheel and the sdist
        run: |
          pip install build
          python -m build --outdir dist .
          ls -l dist

      # What gets released should work. Install the built wheel into a clean environment, away from the source
      # tree, and generate from it.
      - name: Try the wheel
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/openapi-codegen "$GITHUB_WORKSPACE/tests/data/device_api.json" --out /tmp/out/device_api
          /tmp/clean/bin/openapi-codegen "$GITHUB_WORKSPACE/tests/data/device_api.json" --out /tmp/out/device_api --check
          test -f /tmp/out/device_api/clients/_base.py
          test -f /tmp/out/device_api/blueprints/_base.py

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to add the files to the release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # No --clobber: a release's files are not replaced. If one is already there this stops rather than
      # swapping it, so a hash a lockfile recorded stays valid.
      - name: Attach the files to the release
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
