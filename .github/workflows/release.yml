name: Release

# Builds the package when a GitHub release is published and attaches the wheel, the sdist and their checksums to
# it, so other projects can depend on those files (a lockfile records the wheel's hash) instead of on a git tag.
#
# To release: publish a release whose tag is v<version>, e.g. v0.2.0. The package's version is taken from the tag
# when it is built, so there is nothing to raise in pyproject.toml first (its `version` is only a placeholder for
# checkouts) and no way for the two to disagree.
#
# To attach files to a release that already exists, run it by hand (Actions > Release > Run workflow) with its tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of an existing release to build and attach to, e.g. v0.1.0
        required: true
        type: string

# The building runs with a read-only token; only the upload step below can write to the release.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Through the environment, never pasted into a script.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # Only the files that get built carry this version; nothing is committed. --frozen: no lockfile, no sync.
      - name: Set the version from the tag
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::The tag is $TAG, but release tags are v<version>, e.g. v0.2.0."; exit 1 ;;
          esac
          uv version --frozen --package openapi-codegen "${TAG#v}"

      - name: Build the wheel and the sdist
        run: |
          pip install build
          python -m build --outdir dist .
          ls -l dist

      # What gets released should work. Install the built wheel into a clean environment, away from the source
      # tree, and generate from it.
      - name: Try the wheel
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/pip show openapi-codegen | grep '^Version'
          cd /tmp
          /tmp/clean/bin/openapi-codegen "$GITHUB_WORKSPACE/tests/data/device_api.json" --out /tmp/out/device_api
          /tmp/clean/bin/openapi-codegen "$GITHUB_WORKSPACE/tests/data/device_api.json" --out /tmp/out/device_api --check
          test -f /tmp/out/device_api/clients/_base.py
          test -f /tmp/out/device_api/blueprints/_base.py

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to add the files to the release
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # No --clobber: a release's files are not replaced. If one is already there this stops rather than
      # swapping it, so a hash a lockfile recorded stays valid.
      - name: Attach the files to the release
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
