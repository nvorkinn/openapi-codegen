name: All checks

# The one check branch protection requires is "Global PR Status", opened by Create Global PR Status and completed by
# this once every other workflow and check on the commit has passed. The logic is shared: see
# nvorkinn/.github/.github/workflows/all-checks.yml. Each workflow listed here ends by running this once; add a workflow
# that runs on pull requests to the list. It also approves the PR just before the check succeeds, which needs "Allow
# GitHub Actions to create and approve pull requests" enabled in the repository's settings.
on:
  workflow_run:
    workflows: [ Create Global PR Status, CI, CodeQL, GitHub Advanced Security ]
    types: [ completed ]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  all-checks:
    uses: nvorkinn/.github/.github/workflows/all-checks.yml@8bb6e7191533a6fecf141a0359cf18e6b9d841e2 # main
    with:
      approve: true
