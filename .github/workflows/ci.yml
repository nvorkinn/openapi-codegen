name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Test
        run: uv run --frozen pytest -v

  # The tests run against the source tree, which has files the wheel might leave out (runtime/ is data, not a
  # package). Install the built wheel somewhere clean and generate from it.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5

      - name: Build and install the wheel
        run: |
          uv build --wheel --python 3.14
          uv venv --python 3.14 /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl

      - name: Generate from the installed wheel
        working-directory: /tmp
        run: |
          /tmp/clean/bin/openapi-codegen "$GITHUB_WORKSPACE/tests/data/device_api.json" --out /tmp/out/device_api
          test -f /tmp/out/device_api/clients/_base.py
          test -f /tmp/out/device_api/blueprints/_base.py
          /tmp/clean/bin/openapi-codegen "$GITHUB_WORKSPACE/tests/data/device_api.json" --out /tmp/out/device_api --check
